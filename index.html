<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sup Ai</title>
  <meta name="description" content="حمّل تطبيق Sup Ai مجاناً من قوقل بلاي أو من الموقع مباشرة.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <!-- أيقونة التطبيق -->
    <div class="app-icon">
      <img src="Image/logo%20application.jpg" alt="Sup Ai" loading="eager">
    </div>

    <!-- اسم التطبيق -->
    <h1>Sup Ai</h1>

    <!-- التقييم -->
    <div class="rating">
      <span class="stars" aria-label="تقييم 4.8 من 5">★★★★★</span>
      <span>4.8 • مجاني</span>
    </div>

    <!-- الوصف -->
    <p class="description">
      هنا اكتب سطر عن تطبيقك، بيعمل شنو؟<br>
      وهنا اكتب السطر التاني، ليه الناس تحمله؟
    </p>

    <!-- أزرار التحميل -->
    <div class="buttons">
      <a href="#" class="btn btn-play" id="playBtn">
        <span>تحميل من</span>
        <b>Google Play</b>
      </a>
      <a href="#" class="btn btn-site" id="siteBtn">
        تحميل من الموقع
      </a>
    </div>

    <!-- المميزات -->
    <div class="pills">
      <span>سريع</span>
      <span>آمن</span>
      <span>بدون إنترنت</span>
    </div>

    <!-- صور التطبيق - صور بس، زي قوقل بلاي -->
    <div class="screenshots">
      <img src="Image/1.jpg" alt="شكل التطبيق 1" loading="lazy">
      <img src="Image/2.jpg" alt="شكل التطبيق 2" loading="lazy">
      <img src="Image/3.jpg" alt="شكل التطبيق 3" loading="lazy">
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
